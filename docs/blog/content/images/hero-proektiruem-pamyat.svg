  <g transform="translate(300, 250)">
    <rect x="0" y="0" width="200" height="100" rx="10" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>
    <text x="100" y="50" font-family="Arial" font-size="24" text-anchor="middle" fill="#212529">STM</text>
    <text x="100" y="80" font-family="Arial" font-size="16" text-anchor="middle" fill="#6c757d">Краткосрочная</text>
  </g>
  <g transform="translate(500, 250)">
