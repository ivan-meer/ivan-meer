<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="8" fill="oklch(0.12 0.012 265)"/>
  <text x="200" y="28" font-family="Oswald,sans-serif" font-size="13" fill="oklch(0.94 0.006 100)" text-anchor="middle" letter-spacing="2">ПАМЯТЬ / RAG</text>
  <line x1="60" y1="38" x2="340" y2="38" stroke="oklch(0.25 0.01 265)" stroke-width="1"/>

  <!-- Inner ring: STM -->
  <circle cx="200" cy="155" r="28" fill="none" stroke="oklch(0.88 0.19 128)" stroke-width="1.5"/>
  <text x="200" y="152" font-family="JetBrains Mono,monospace" font-size="8" fill="oklch(0.88 0.19 128)" text-anchor="middle">STM</text>
  <text x="200" y="162" font-family="JetBrains Mono,monospace" font-size="6" fill="oklch(0.7 0.012 265)" text-anchor="middle">session</text>

  <!-- Middle ring: LTM -->
  <circle cx="200" cy="155" r="56" fill="none" stroke="oklch(0.7 0.15 128 / 0.5)" stroke-width="1.5"/>
  <text x="200" y="104" font-family="JetBrains Mono,monospace" font-size="8" fill="oklch(0.7 0.15 128)" text-anchor="middle">LTM</text>
  <text x="232" y="196" font-family="JetBrains Mono,monospace" font-size="6" fill="oklch(0.6 0.012 265)" text-anchor="middle">RAG</text>

  <!-- Outer ring: Semantic -->
  <circle cx="200" cy="155" r="84" fill="none" stroke="oklch(0.5 0.012 265)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="130" y="220" font-family="JetBrains Mono,monospace" font-size="8" fill="oklch(0.5 0.012 265)" text-anchor="middle">semantic</text>
  <text x="270" y="100" font-family="JetBrains Mono,monospace" font-size="7" fill="oklch(0.45 0.012 265)" text-anchor="middle">вектора</text>

  <!-- Search arrows -->
  <line x1="200" y1="240" x2="200" y2="260" stroke="oklch(0.88 0.19 128 / 0.3)" stroke-width="1.5"/>
  <polygon points="200,262 195,255 205,255" fill="oklch(0.88 0.19 128 / 0.3)"/>
  <text x="250" y="258" font-family="JetBrains Mono,monospace" font-size="7" fill="oklch(0.5 0.012 265)">hybrid search</text>

  <!-- Chunk indicators -->
  <rect x="80" y="60" width="12" height="4" rx="1" fill="oklch(0.6 0.012 265 / 0.4)"/>
  <rect x="100" y="64" width="12" height="4" rx="1" fill="oklch(0.6 0.012 265 / 0.3)"/>
  <rect x="88" y="50" width="10" height="4" rx="1" fill="oklch(0.6 0.012 265 / 0.5)"/>
</svg>