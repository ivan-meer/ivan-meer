  <line x1="300" y1="350" x2="500" y2="350" stroke="#6c757d" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="500" y1="350" x2="700" y2="350" stroke="#6c757d" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="700" y1="350" x2="900" y2="350" stroke="#6c757d" stroke-width="2" stroke-dasharray="5,5"/>
