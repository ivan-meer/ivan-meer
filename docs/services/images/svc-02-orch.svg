<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="8" fill="oklch(0.12 0.012 265)"/>
  <text x="200" y="28" font-family="Oswald,sans-serif" font-size="13" fill="oklch(0.94 0.006 100)" text-anchor="middle" letter-spacing="2">ОРКЕСТРАЦИЯ</text>
  <line x1="60" y1="38" x2="340" y2="38" stroke="oklch(0.25 0.01 265)" stroke-width="1"/>

  <!-- Event bus line -->
  <line x1="50" y1="180" x2="350" y2="180" stroke="oklch(0.88 0.19 128 / 0.2)" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Queue boxes -->
  <rect x="60" y="195" width="80" height="28" rx="4" fill="oklch(0.16 0.01 140)" stroke="oklch(0.88 0.19 128 / 0.3)" stroke-width="1"/>
  <text x="100" y="213" font-family="JetBrains Mono,monospace" font-size="8" fill="oklch(0.7 0.012 265)" text-anchor="middle">QUEUE</text>

  <rect x="160" y="195" width="80" height="28" rx="4" fill="oklch(0.16 0.01 140)" stroke="oklch(0.88 0.19 128 / 0.3)" stroke-width="1"/>
  <text x="200" y="213" font-family="JetBrains Mono,monospace" font-size="8" fill="oklch(0.7 0.012 265)" text-anchor="middle">RETRY</text>

  <rect x="260" y="195" width="80" height="28" rx="4" fill="oklch(0.16 0.01 140)" stroke="oklch(0.88 0.19 128 / 0.3)" stroke-width="1"/>
  <text x="300" y="213" font-family="JetBrains Mono,monospace" font-size="8" fill="oklch(0.7 0.012 265)" text-anchor="middle">ALERT</text>

  <!-- Metrics panel -->
  <rect x="100" y="65" width="200" height="44" rx="6" fill="oklch(0.16 0.01 140)" stroke="oklch(0.6 0.015 265)" stroke-width="1"/>
  <text x="200" y="82" font-family="JetBrains Mono,monospace" font-size="7" fill="oklch(0.5 0.012 265)" text-anchor="middle">METRICS</text>
  <text x="200" y="94" font-family="JetBrains Mono,monospace" font-size="9" fill="oklch(0.88 0.19 128)" text-anchor="middle">$  %  ms  err</text>

  <!-- Observability line -->
  <line x1="200" y1="109" x2="200" y2="150" stroke="oklch(0.88 0.19 128 / 0.2)" stroke-width="1.5"/>

  <!-- Trace nodes -->
  <circle cx="90" cy="150" r="8" fill="none" stroke="oklch(0.6 0.012 265)" stroke-width="1"/>
  <circle cx="200" cy="150" r="8" fill="none" stroke="oklch(0.6 0.012 265)" stroke-width="1"/>
  <circle cx="310" cy="150" r="8" fill="none" stroke="oklch(0.6 0.012 265)" stroke-width="1"/>
  <line x1="98" y1="150" x2="192" y2="150" stroke="oklch(0.88 0.19 128 / 0.3)" stroke-width="1.5"/>
  <line x1="208" y1="150" x2="302" y2="150" stroke="oklch(0.88 0.19 128 / 0.3)" stroke-width="1.5"/>
  <text x="90" y="140" font-family="JetBrains Mono,monospace" font-size="6" fill="oklch(0.5 0.012 265)" text-anchor="middle">trace</text>
  <text x="200" y="140" font-family="JetBrains Mono,monospace" font-size="6" fill="oklch(0.5 0.012 265)" text-anchor="middle">trace</text>
  <text x="310" y="140" font-family="JetBrains Mono,monospace" font-size="6" fill="oklch(0.5 0.012 265)" text-anchor="middle">trace</text>

  <!-- Bottom tags -->
  <text x="60" y="250" font-family="JetBrains Mono,monospace" font-size="7" fill="oklch(0.45 0.012 265)">routes</text>
  <text x="120" y="250" font-family="JetBrains Mono,monospace" font-size="7" fill="oklch(0.45 0.012 265)">isolate</text>
  <text x="185" y="250" font-family="JetBrains Mono,monospace" font-size="7" fill="oklch(0.45 0.012 265)">prioritize</text>
  <text x="268" y="250" font-family="JetBrains Mono,monospace" font-size="7" fill="oklch(0.45 0.012 265)">escalate</text>
</svg>