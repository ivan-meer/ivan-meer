<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <rect width="1200" height="400" fill="oklch(0.12 0.012 265)"/>

  <!-- Grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="50" x2="1200" y2="50" stroke="oklch(0.94 0.006 100)" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="oklch(0.94 0.006 100)" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="oklch(0.94 0.006 100)" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="oklch(0.94 0.006 100)" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="1200" y2="250" stroke="oklch(0.94 0.006 100)" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="oklch(0.94 0.006 100)" stroke-width="0.5"/>
    <line x1="0" y1="350" x2="1200" y2="350" stroke="oklch(0.94 0.006 100)" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="400" stroke="oklch(0.94 0.006 100)" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="oklch(0.94 0.006 100)" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="400" stroke="oklch(0.94 0.006 100)" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke="oklch(0.94 0.006 100)" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="oklch(0.94 0.006 100)" stroke-width="0.5"/>
    <line x1="1100" y1="0" x2="1100" y2="400" stroke="oklch(0.94 0.006 100)" stroke-width="0.5"/>
  </g>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="oklch(0.88 0.19 128 / 0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#g)"/>

  <!-- Floating node icons -->
  <g opacity="0.06">
    <circle cx="200" cy="120" r="40" fill="none" stroke="oklch(0.88 0.19 128)" stroke-width="1"/>
    <circle cx="500" cy="300" r="50" fill="none" stroke="oklch(0.88 0.19 128)" stroke-width="1"/>
    <circle cx="800" cy="100" r="35" fill="none" stroke="oklch(0.88 0.19 128)" stroke-width="1"/>
    <circle cx="1000" cy="280" r="45" fill="none" stroke="oklch(0.88 0.19 128)" stroke-width="1"/>
    <circle cx="350" cy="200" r="25" fill="none" stroke="oklch(0.88 0.19 128)" stroke-width="1"/>
  </g>

  <!-- Subtle lines between nodes -->
  <g opacity="0.03">
    <line x1="200" y1="120" x2="500" y2="300" stroke="oklch(0.88 0.19 128)" stroke-width="0.5"/>
    <line x1="500" y1="300" x2="800" y2="100" stroke="oklch(0.88 0.19 128)" stroke-width="0.5"/>
    <line x1="800" y1="100" x2="1000" y2="280" stroke="oklch(0.88 0.19 128)" stroke-width="0.5"/>
    <line x1="350" y1="200" x2="500" y2="300" stroke="oklch(0.88 0.19 128)" stroke-width="0.5"/>
    <line x1="200" y1="120" x2="350" y2="200" stroke="oklch(0.88 0.19 128)" stroke-width="0.5"/>
  </g>

  <!-- Accent corner marker -->
  <rect x="0" y="0" width="3" height="400" fill="oklch(0.88 0.19 128 / 0.5)"/>
</svg>